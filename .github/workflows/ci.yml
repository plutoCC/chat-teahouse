name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:publication
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Browser smoke tests (isolated fixtures only)
        if: runner.os == 'Windows'
        env:
          CHAT_TEA_BROWSER_CHANNEL: msedge
        run: npx tsx --test tests/browser/free-chat-ui.test.ts tests/browser/publication-status-ui.test.ts
